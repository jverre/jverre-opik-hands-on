[project]
name = "crewai-street-festival-planner"
version = "0.1.0"
description = "A three-agent CrewAI crew plans a fictional street festival from offline files."
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.17",
    "python-dotenv>=1.2.3",
]

[project.scripts]
festival = "street_festival.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/street_festival"]

[tool.pytest.ini_options]
testpaths = ["tests"]
