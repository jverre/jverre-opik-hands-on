quarkus.application.name=quarkus-langchain4j-pharmacy-faq
quarkus.http.port=4300

# --- LangChain4j / OpenAI -------------------------------------------------
# The key comes from the environment (run.sh loads it from .env); never commit it.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:missing}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.temperature=0
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
quarkus.langchain4j.openai.timeout=60s

# --- Opik over OpenTelemetry ----------------------------------------------
# Quarkus's OpenTelemetry extension exports spans to Opik's OTLP endpoint (http/protobuf).
# The endpoint defaults to a local self-hosted Opik; run.sh derives it from OPIK_URL_OVERRIDE.
quarkus.otel.enabled=true
quarkus.otel.traces.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=${OPIK_OTEL_ENDPOINT:http://localhost:5173/api/v1/private/otel}
quarkus.otel.exporter.otlp.traces.protocol=http/protobuf
# Comet-Workspace picks the workspace, projectName picks the Opik project that receives the traces.
# For Opik Cloud add an Authorization=<api key> header here (see README).
quarkus.otel.exporter.otlp.traces.headers=Comet-Workspace=${OPIK_WORKSPACE:default},projectName=${OPIK_PROJECT_NAME:quarkus-langchain4j-pharmacy-faq}
# Flush quickly so short demo runs do not lose their last spans.
quarkus.otel.bsp.schedule.delay=1s

# Without these two flags LLM spans carry model and token counts but NO prompt or completion text.
quarkus.langchain4j.tracing.include-prompt=true
quarkus.langchain4j.tracing.include-completion=true
