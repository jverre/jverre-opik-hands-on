# Optional: an Ollama server for readers who don't have one yet.
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2:1b
#   docker compose exec ollama ollama pull nomic-embed-text
services:
  ollama:
    image: ollama/ollama
    container_name: ollama-homebrew-rag
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:
