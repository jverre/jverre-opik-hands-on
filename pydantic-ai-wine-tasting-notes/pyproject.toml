[project]
name = "pydantic-ai-wine-tasting-notes"
version = "0.1.0"
description = "Pydantic AI agent that turns messy sommelier notes into typed tasting records"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]>=1.0",
    "python-dotenv>=1.0",
]

[project.scripts]
tasting = "tasting.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tasting"]
