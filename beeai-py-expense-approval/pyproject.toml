[project]
name = "beeai-py-expense-approval"
version = "0.1.0"
description = "A BeeAI ReAct agent that triages expense reports against a fictional company policy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beeai-framework>=0.1.86",
    "openinference-instrumentation-beeai>=0.1.39",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opik==2.3.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expense_agent"]
