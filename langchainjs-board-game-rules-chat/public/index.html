<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Moss &amp; Meeple Rules Helper</title>
  <style>
    :root { --bg: #efe9dc; --card: #fffdf7; --accent: #2f6b4f; --bot: #e8efe6; --text: #28302a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); font-family: Georgia, "Times New Roman", serif; color: var(--text); padding: 16px; }
    .widget { width: 100%; max-width: 420px; height: 600px; max-height: 90vh; background: var(--card);
      border-radius: 14px; box-shadow: 0 10px 40px rgba(40, 48, 42, 0.18); display: flex; flex-direction: column; overflow: hidden; }
    header { background: var(--accent); color: #fff; padding: 14px 18px; }
    header h1 { margin: 0; font-size: 17px; }
    header p { margin: 2px 0 0; font-size: 12px; opacity: 0.85; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; }
    .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #e2dccd; }
    input { flex: 1; border: 1px solid #cfc8b6; border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none; }
    input:focus { border-color: var(--accent); }
    button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 0 18px; font-size: 14px; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="widget">
    <header>
      <h1>Moss &amp; Meeple Rules Helper</h1>
      <p>Lantern Heist, Moth &amp; Marmalade, Tidewalkers, Quill &amp; Cauldron</p>
    </header>
    <div id="messages">
      <div class="msg bot">Hi! Ask me a rules question about any of our house games.</div>
    </div>
    <form id="chat-form">
      <input id="input" autocomplete="off" placeholder="e.g. How does the Watchman move?" />
      <button id="send" type="submit">Ask</button>
    </form>
  </div>
  <script>
    // One sessionId per browser tab: the server keeps this table's history under it.
    let sessionId;
    try {
      sessionId = sessionStorage.getItem("meeple-session");
      if (!sessionId) {
        sessionId = "table-" + crypto.randomUUID().slice(0, 8);
        sessionStorage.setItem("meeple-session", sessionId);
      }
    } catch {
      sessionId = "table-" + crypto.randomUUID().slice(0, 8);
    }
    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    function addMessage(text, role) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      addMessage(message, "user");
      send.disabled = true;
      const pending = addMessage("...", "bot");
      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, sessionId }),
        });
        const data = await response.json();
        pending.textContent = response.ok ? data.reply : (data.error || "Something went wrong.");
      } catch {
        pending.textContent = "Could not reach the server.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
