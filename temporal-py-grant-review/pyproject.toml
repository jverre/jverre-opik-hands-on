[project]
name = "temporal-py-grant-review"
version = "0.1.0"
description = "Durable community-grant review workflow on Temporal, traced across client and worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "temporalio>=1.8",
]

[project.scripts]
grant-demo = "grant_review.demo:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grant_review"]
