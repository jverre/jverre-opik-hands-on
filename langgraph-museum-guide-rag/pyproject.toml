[project]
name = "langgraph-museum-guide-rag"
version = "0.1.0"
description = "Two-node LangGraph RAG over a fictional museum guide"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8",
    "langchain-openai>=1.8",
    "langgraph>=1.2",
    "numpy>=2.0",
    "opik>=2.3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
